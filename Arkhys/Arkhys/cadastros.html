<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arkhys | Cadastros</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,380..680&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style-global.css">

    <script type="module" src="js/supabase-config.js"></script>
</head>
<body>

    <div class="bg-dinamico" aria-hidden="true"></div>

    <nav class="navegacao">
        <div class="nav-conteudo">
            <a href="index.html" class="nav-logo">
                <img src="assets/logo-arkhys.png" alt="Arkhys" loading="lazy">
            </a>

            <div class="nav-links">
                <a href="index.html" class="nav-item">
                    <span class="nav-icone">🏠</span>
                    <span>Início</span>
                </a>
                <a href="hoje.html" class="nav-item">
                    <span class="nav-icone">📅</span>
                    <span>Hoje</span>
                </a>
                <a href="tarefas.html" class="nav-item">
                    <span class="nav-icone">📋</span>
                    <span>Tarefas</span>
                </a>
                <a href="cadastros.html" class="nav-item ativo">
                    <span class="nav-icone">⚙️</span>
                    <span>Cadastros</span>
                </a>
                <a href="calendario.html" class="nav-item">
                    <span class="nav-icone">🗓️</span>
                    <span>Calendário</span>
                </a>
                <a href="arquivos.html" class="nav-item">
                    <span class="nav-icone">📁</span>
                    <span>Cofre</span>
                </a>
                <a href="perfil.html" class="nav-item">
                    <span class="nav-icone">👤</span>
                    <span>Perfil</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="conteudo-principal">
        <header class="cabecalho-pagina">
            <div class="cabecalho-texto">
                <h1>Cadastros</h1>
                <span>Gerencie os itens que aparecem no sistema</span>
            </div>
        </header>

        <div class="grid-cards">
            <button class="card-resumo botao-card" data-modal="modalMaterias">
                <div class="card-icone">📚</div>
                <div class="card-titulo">Matérias</div>
                <div class="card-detalhe">Disciplinas e assuntos</div>
            </button>

            <button class="card-resumo botao-card" data-modal="modalOrgaos">
                <div class="card-icone">🏛️</div>
                <div class="card-titulo">Órgãos</div>
                <div class="card-detalhe">Instituições e eventos</div>
            </button>

            <button class="card-resumo botao-card" data-modal="modalFerramentas">
                <div class="card-icone">🛠️</div>
                <div class="card-titulo">Ferramentas</div>
                <div class="card-detalhe">Materiais e recursos</div>
            </button>

            <button class="card-resumo botao-card" data-modal="modalMembros">
                <div class="card-icone">👥</div>
                <div class="card-titulo">Membros</div>
                <div class="card-detalhe">Pessoas e equipes</div>
            </button>
        </div>
    </main>

    <!-- MODAIS DE CADASTRO -->
    <div id="modalMaterias" hidden>
        <div class="form-modal">
            <div class="cabecalho-modal">
                <h3>Cadastrar Matéria</h3>
                <button type="button" class="btn-acao fechar-modal">✕</button>
            </div>
            <form id="formMaterias">
                <div class="grupo-campo">
                    <label>NOME DA MATÉRIA</label>
                    <input type="text" class="campo-entrada" required>
                </div>
                <div class="acoes-form">
                    <button type="submit" class="botao botao-primario w-full">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modalOrgaos" hidden>
        <div class="form-modal">
            <div class="cabecalho-modal">
                <h3>Cadastrar Órgão</h3>
                <button type="button" class="btn-acao fechar-modal">✕</button>
            </div>
            <form id="formOrgaos">
                <div class="grupo-campo">
                    <label>NOME DO ÓRGÃO</label>
                    <input type="text" class="campo-entrada" required>
                </div>
                <div class="grupo-campo">
                    <label>DESCRIÇÃO</label>
                    <textarea class="campo-entrada" rows="2"></textarea>
                </div>
                <div class="acoes-form">
                    <button type="submit" class="botao botao-primario w-full">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modalFerramentas" hidden>
        <div class="form-modal">
            <div class="cabecalho-modal">
                <h3>Cadastrar Ferramenta</h3>
                <button type="button" class="btn-acao fechar-modal">✕</button>
            </div>
            <form id="formFerramentas">
                <div class="grupo-campo">
                    <label>NOME DA FERRAMENTA</label>
                    <input type="text" class="campo-entrada" required>
                </div>
                <div class="grupo-campo">
                    <label>TIPO</label>
                    <input type="text" class="campo-entrada" placeholder="Ex: Livro, Aplicativo, Equipamento">
                </div>
                <div class="acoes-form">
                    <button type="submit" class="botao botao-primario w-full">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modalMembros" hidden>
        <div class="form-modal">
            <div class="cabecalho-modal">
                <h3>Cadastrar Membro</h3>
                <button type="button" class="btn-acao fechar-modal">✕</button>
            </div>
            <form id="formMembros">
                <div class="grupo-campo">
                    <label>NOME COMPLETO</label>
                    <input type="text" class="campo-entrada" required>
                </div>
                <div class="grupo-campo">
                    <label>FUNÇÃO / CARGO</label>
                    <input type="text" class="campo-entrada">
                </div>
                <div class="acoes-form">
                    <button type="submit" class="botao botao-primario w-full">Salvar</button>
                </div>
            </form>
        </div>
    </div>

        <script src="js/ui.js"></script>

    <script type="module" src="js/cadastros.js"></script>
</body>
</html>
