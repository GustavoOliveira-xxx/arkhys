    <nav class="navegacao">
        <div class="nav-conteudo">
            <a href="index.html" class="nav-logo" aria-label="Arkhys"><span class="marca ">
                <span class="marca-palco">
                    <span class="marca-halo" aria-hidden="true"></span>
                    <img class="marca-sombra" src="assets/logo-arkhys.png" alt="" aria-hidden="true">
                    <img class="marca-arte" src="assets/logo-arkhys.png" alt="Arkhys">
                    <span class="marca-lustro" aria-hidden="true"></span>
                </span>
            </span>            </a>

            <div class="nav-links">
                <a href="index.html" class="nav-item">
                    <span class="nav-icone"><svg class="icon-svg"><use href="assets/icones/arkhys-icons.svg#icon-home"></use></svg></span>
                    <span>Início</span>
                </a>
                <a href="tarefas.html" class="nav-item">
                    <span class="nav-icone"><svg class="icon-svg"><use href="assets/icones/arkhys-icons.svg#icon-tarefas"></use></svg></span>
                    <span>Tarefas</span>
                </a>
                <a href="rotinas.html" class="nav-item">
                    <span class="nav-icone"><svg class="icon-svg"><use href="assets/icones/arkhys-icons.svg#icon-nota"></use></svg></span>
                    <span>Rotina</span>

                <a href="revisoes.html" class="nav-item">
                    <span class="nav-icone"><svg class="icon-svg"><use href="assets/icones/arkhys-icons.svg#icon-reabrir"></use></svg></span>
                    <span>Revisões</span>
                </a>
                <a href="calendario.html" class="nav-item">
                    <span class="nav-icone"><svg class="icon-svg"><use href="assets/icones/arkhys-icons.svg#icon-calendario"></use></svg></span>
                    <span>Calendário</span>
                </a>
                <a href="xp.html" class="nav-item">
                    <span class="nav-icone"><svg class="icon-svg"><use href="assets/icones/arkhys-icons.svg#icon-xp"></use></svg></span>

                <a href="cadastros.html" class="nav-item">

                    <span>Perfil</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="conteudo-principal">
        <header class="cabecalho-pagina cabecalho-peca">
            <div class="cofre-3d" data-cofre aria-hidden="true">
                <div class="cofre-palco">
                    <div class="cofre-cubo">
                        <span class="cofre-face cofre-frente">
                            <span class="cofre-disco">
                                <span class="cofre-raio"></span>
                                <span class="cofre-raio"></span>
                                <span class="cofre-raio"></span>
                                <span class="cofre-miolo"></span>
                            </span>
                            <span class="cofre-rebite cofre-rebite-1"></span>
                            <span class="cofre-rebite cofre-rebite-2"></span>
                            <span class="cofre-rebite cofre-rebite-3"></span>
                            <span class="cofre-rebite cofre-rebite-4"></span>
                        </span>
                        <span class="cofre-face cofre-tras"></span>
                        <span class="cofre-face cofre-esquerda"></span>
                        <span class="cofre-face cofre-direita"></span>
                        <span class="cofre-face cofre-topo"></span>
                        <span class="cofre-face cofre-base"></span>
                    </div>
                    <span class="cofre-halo"></span>
                    <span class="cofre-sombra"></span>
                </div>
            </div>
            <div class="cabecalho-texto">
                <h1>Cofre de Arquivos</h1>
                <p>Seus documentos e materiais guardados com segurança</p>
            </div>
            <button type="button" id="btnEnviar" class="botao botao-primario">+ Adicionar Arquivo</button>
            <input type="file" id="inputArquivo" accept=".pdf,.doc,.docx,.jpg,.png,.jpeg" hidden>
        </header>

        <div class="abas-tarefas" id="abasArquivos" role="tablist">
            <button type="button" class="aba-tarefa ativa" data-filtro="todos"><svg class="icon-svg icon-svg-btn"><use href="assets/icones/arkhys-icons.svg#icon-arquivos"></use></svg> Todos</button>
            <button type="button" class="aba-tarefa" data-filtro="entregas"><svg class="icon-svg icon-svg-btn"><use href="assets/icones/arkhys-icons.svg#icon-entrega"></use></svg> Entregas</button>
            <button type="button" class="aba-tarefa" data-filtro="anexos"><svg class="icon-svg icon-svg-btn"><use href="assets/icones/arkhys-icons.svg#icon-anexo"></use></svg> Anexos e arquivos</button>
        </div>

        <div class="barra-busca-cofre">
            <span class="barra-busca-icone" aria-hidden="true">🔍</span>
            <input type="search" id="buscaArquivos" class="campo-entrada" placeholder="Pesquisar anexos pelo nome..." autocomplete="off">
            <button type="button" id="limparBusca" class="btn-acao" title="Limpar busca" hidden>
                <svg class="icon-svg"><use href="assets/icones/arkhys-icons.svg#icon-fechar"></use></svg>
            </button>
        </div>

        <div class="lista-itens" id="listaArquivos"></div>
    </main>

        <script src="js/ui.js?v=3"></script>
    <script type="module" src="js/arquivos.js"></script>
</body>
</html>
