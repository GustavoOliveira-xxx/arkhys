<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arkhys | Criar Conta</title>
    <link rel="icon" type="image/png" href="assets/logo-arkhys-b.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,380..680&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style-global.css">

    <script type="module" src="js/supabase-config.js"></script>
</head>
<body class="tela-acesso">

    <div class="bg-dinamico" aria-hidden="true"></div>

    <div class="caixa-acesso">
        <div class="logo-acesso">
            <img src="assets/logo-arkhys.png" alt="Arkhys">
        </div>

        <h1 class="titulo-acesso">Criar Conta</h1>
        <p class="subtitulo-acesso">Comece a organizar seus estudos com o Arkhys</p>

        <form class="form-acesso" id="formCadastro">
            <div class="grupo-campo">
                <label for="nome">NOME COMPLETO</label>
                <input type="text" id="nome" class="campo-entrada" placeholder="Seu nome completo" required>
            </div>

            <div class="grupo-campo">
                <label for="email">E-MAIL</label>
                <input type="email" id="email" class="campo-entrada" placeholder="seuemail@exemplo.com" required>
            </div>

            <div class="grupo-campo">
                <label for="senha">SENHA</label>
                <input type="password" id="senha" class="campo-entrada" placeholder="Mínimo 6 caracteres" required minlength="6">
            </div>

            <div class="grupo-campo">
                <label for="confirmaSenha">CONFIRMAR SENHA</label>
                <input type="password" id="confirmaSenha" class="campo-entrada" placeholder="Repita a senha" required>
            </div>

            <div class="acoes-form">
                <button type="submit" class="botao botao-primario w-full">Cadastrar</button>
                <span class="link-cadastro">
                    Já tem conta? <a href="login.html">Entrar</a>
                </span>
            </div>
        </form>
    </div>

        <script src="js/ui.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
