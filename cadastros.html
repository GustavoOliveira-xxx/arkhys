<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arkhys | Cadastros</title>
    <link rel="icon" type="image/png" href="assets/logo-arkhys-b.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,380..680&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style-global.css">
    <link rel="stylesheet" href="css/icones.css">
    <script type="module" src="js/loading.js"></script>
    <script type="module" src="js/supabase-config.js"></script>
</head>
<body>
    <div class="bg-dinamico" aria-hidden="true"></div>

    <a href="index.html" class="logo-mobile-flutuante" aria-label="Arkhys">
        <img src="assets/logo-arkhys.png" alt="Arkhys" loading="lazy">
    </a>
    <nav class="navegacao">
        <div class="nav-conteudo">
            <a href="index.html" class="nav-logo">
                <img src="assets/logo-arkhys.png" alt="Arkhys" loading="lazy">
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-item">
                    <span class="nav-icone"><svg class="icon-svg"><use href="assets/icones/arkhys-icons.svg#icon-home"></use></svg></span>
                    <span>Início</span>
                </a>
                <a href="tarefas.html" class="nav-item">
                    <span class="nav-icone"><svg class="icon-svg"><use href="assets/icones/arkhys-icons.svg#icon-tarefas"></use></svg></span>
                    <span>Tarefas</span>
                </a>
                <a href="rotinas.html" class="nav-item">
                    <span class="nav-icone"><svg class="icon-svg"><use href="assets/icones/arkhys-icons.svg#icon-nota"></use></svg></span>
                    <span>Rotina</span>
                </a>
                <a href="cadastros.html" class="nav-item ativo">
                    <span class="nav-icone"><svg class="icon-svg"><use href="assets/icones/arkhys-icons.svg#icon-config"></use></svg></span>
                    <span>Cadastros</span>
                </a>
                <a href="calendario.html" class="nav-item">
                    <span class="nav-icone"><svg class="icon-svg"><use href="assets/icones/arkhys-icons.svg#icon-calendario"></use></svg></span>
                    <span>Calendário</span>
                </a>
                <a href="xp.html" class="nav-item">
                    <span class="nav-icone"><svg class="icon-svg"><use href="assets/icones/arkhys-icons.svg#icon-xp"></use></svg></span>
                    <span>XP</span>
                </a>
                <a href="arquivos.html" class="nav-item">
                    <span class="nav-icone"><svg class="icon-svg"><use href="assets/icones/arkhys-icons.svg#icon-arquivos"></use></svg></span>
                    <span>Cofre</span>
                </a>
                <a href="perfil.html" class="nav-item">
                    <span class="nav-icone"><svg class="icon-svg"><use href="assets/icones/arkhys-icons.svg#icon-perfil"></use></svg></span>
                    <span>Perfil</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="conteudo-principal">
        <header class="cabecalho-pagina">
            <div class="cabecalho-texto">
                <h1>Cadastros</h1>
                <span>Gerencie os itens do seu sistema</span>
            </div>
        </header>

        <div class="grid-cards">
            <button class="card-resumo botao-card" data-aba="materias">
                <div class="card-icone"><svg class="icon-svg"><use href="assets/icones/arkhys-icons.svg#icon-materias"></use></svg></div>
                <div class="card-titulo">Matérias</div>
                <div class="card-detalhe">Disciplinas e assuntos</div>
            </button>
            <button class="card-resumo botao-card" data-aba="orgaos">
                <div class="card-icone"><svg class="icon-svg"><use href="assets/icones/arkhys-icons.svg#icon-orgaos"></use></svg></div>
                <div class="card-titulo">Órgãos</div>
                <div class="card-detalhe">Instituições e eventos</div>
            </button>
            <button class="card-resumo botao-card" data-aba="ferramentas">
                <div class="card-icone"><svg class="icon-svg"><use href="assets/icones/arkhys-icons.svg#icon-ferramentas"></use></svg></div>
                <div class="card-titulo">Ferramentas</div>
                <div class="card-detalhe">Materiais e recursos</div>
            </button>
            <button class="card-resumo botao-card" data-aba="tipos_entrega">
                <div class="card-icone"><svg class="icon-svg"><use href="assets/icones/arkhys-icons.svg#icon-entrega"></use></svg></div>
                <div class="card-titulo">Tipos de Entrega</div>
                <div class="card-detalhe">Formatos aceitos nas atividades</div>
            </button>
            <button class="card-resumo botao-card" data-aba="membros">
                <div class="card-icone"><svg class="icon-svg"><use href="assets/icones/arkhys-icons.svg#icon-membros"></use></svg></div>
                <div class="card-titulo">Membros</div>
                <div class="card-detalhe">Pessoas e equipes</div>
            </button>
        </div>
    </main>

        <div id="modalGerenciador" class="modal-overlay" hidden>
        <div class="form-modal modal-gerenciador">
            <div class="cabecalho-modal">
                <div class="abas-navegacao">
                    <button class="aba-item" data-aba="materias"><svg class="icon-svg icon-svg-btn"><use href="assets/icones/arkhys-icons.svg#icon-materias"></use></svg> Matérias</button>
                    <button class="aba-item" data-aba="orgaos"><svg class="icon-svg icon-svg-btn"><use href="assets/icones/arkhys-icons.svg#icon-orgaos"></use></svg> Órgãos</button>
                    <button class="aba-item" data-aba="ferramentas"><svg class="icon-svg icon-svg-btn"><use href="assets/icones/arkhys-icons.svg#icon-ferramentas"></use></svg> Ferramentas</button>
                    <button class="aba-item" data-aba="tipos_entrega"><svg class="icon-svg icon-svg-btn"><use href="assets/icones/arkhys-icons.svg#icon-entrega"></use></svg> Tipos de Entrega</button>
                    <button class="aba-item" data-aba="membros"><svg class="icon-svg icon-svg-btn"><use href="assets/icones/arkhys-icons.svg#icon-membros"></use></svg> Membros</button>
                </div>
                <button type="button" class="btn-acao fechar-modal"><svg class="icon-svg"><use href="assets/icones/arkhys-icons.svg#icon-fechar"></use></svg></button>
            </div>
            <div class="conteudo-gerenciador">
                <div id="viewListagem" class="view-modal">
                    <div class="topo-lista">
                        <h3 id="tituloLista">Matérias</h3>
                        <button id="btnNovoCadastro" class="botao botao-primario">+ Novo Cadastro</button>
                    </div>
                    <div class="divisor-modal"></div>
                    <div id="listaItens" class="lista-itens"></div>
                </div>
                <div id="viewFormulario" class="view-modal" hidden>
                    <div class="topo-form">
                        <button id="btnVoltarLista" class="btn-voltar">&larr; Voltar</button>
                        <h3 id="tituloForm">Cadastrar Novo</h3>
                    </div>
                    <form id="formUnificado">
                        <div id="camposDinamicos"></div>
                        <div class="acoes-form">
                            <button type="submit" class="botao botao-primario w-full">Salvar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="js/ui.js"></script>
    <script type="module" src="js/cadastros.js"></script>
</body>
</html>
