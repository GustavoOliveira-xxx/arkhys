<!DOCTYPE html>
    <html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <title>Arkhys | Acesso</title>
        <meta name="theme-color" content="#050407">
        <link rel="icon" type="image/png" href="assets/arkhys-icone.png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icone-apple.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Arkhys">
    <meta name="mobile-web-app-capable" content="yes">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Fraunces:opsz,wght@9..144,380..680&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/style-global.css?v=3">
    <link rel="stylesheet" href="css/icones.css?v=3">

        <script type="module" src="js/loading.js"></script>
    <script type="module" src="js/supabase-config.js"></script>
    </head>
    <body class="tela-acesso">

        <div class="bg-dinamico" aria-hidden="true"></div>

        <div class="caixa-acesso">
        <div class="hero-acesso">
            <div class="totem" data-totem aria-hidden="true">
                <div class="totem-palco">
                    <span class="totem-halo"></span>
                    <span class="totem-anel totem-anel-1"></span>
                    <span class="totem-anel totem-anel-2"></span>
                    <span class="totem-anel totem-anel-3"></span>
                    <img class="totem-aura" src="assets/arkhys-totem.png" alt="">
                    <img class="totem-corpo" src="assets/arkhys-totem.png" alt="Elmo do Arkhys">
                    <span class="totem-lustro"></span>
                    <span class="totem-faisca"></span>
                    <span class="totem-base"></span>
                    <img class="totem-reflexo" src="assets/arkhys-totem.png" alt="">
                </div>
            </div>
            <div class="logo-acesso"><span class="marca marca-grande">
                <span class="marca-palco">
                    <span class="marca-halo" aria-hidden="true"></span>
                    <img class="marca-sombra" src="assets/logo-arkhys.png" alt="" aria-hidden="true">
                    <img class="marca-arte" src="assets/logo-arkhys.png" alt="Arkhys">
                    <span class="marca-lustro" aria-hidden="true"></span>
                </span>
            </span>            </div>
        </div>

            <h1 class="titulo-acesso">Entrar no Arkhys</h1>
            <p class="subtitulo-acesso">Acesse seu planejamento e estudos</p>

            <form class="form-acesso" id="formLogin">
                <div class="grupo-campo">
                    <label for="email">E-MAIL</label>
                    <input type="email" id="email" class="campo-entrada" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="grupo-campo">
                    <label for="senha">SENHA</label>
                    <input type="password" id="senha" class="campo-entrada" placeholder="••••••••" required>
                </div>

                <div class="acoes-form">
                    <button type="submit" class="botao botao-primario w-full">Acessar</button>
                    <span class="link-cadastro">
                        Não tem conta? <a href="cadastro.html">Crie uma agora</a>
                    </span>
                </div>
            </form>
        </div>
    <script src="js/ui.js?v=3"></script>
        <script type="module" src="js/auth.js"></script>
    </body>
    </html>
