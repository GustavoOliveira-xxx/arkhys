<!DOCTYPE html>
    <html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Arkhys | Acesso</title>
        <meta name="theme-color" content="#050407">
        <link rel="icon" type="image/png" href="assets/arkhys-icone.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Fraunces:opsz,wght@9..144,380..680&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/style-global.css">
    <link rel="stylesheet" href="css/icones.css">

        <script type="module" src="js/loading.js"></script>
    <script type="module" src="js/supabase-config.js"></script>
    </head>
    <body class="tela-acesso">

        <div class="bg-dinamico" aria-hidden="true"></div>

        <div class="caixa-acesso">
        <div class="hero-acesso">
            <div class="totem" data-totem aria-hidden="true"></div>
        </div>

            <h1 class="titulo-acesso">Entrar no Arkhys</h1>
            <p class="subtitulo-acesso">Acesse seu planejamento e estudos</p>

            <form class="form-acesso" id="formLogin">
                <div class="grupo-campo">
                    <label for="email">E-MAIL</label>
                    <input type="email" id="email" class="campo-entrada" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="grupo-campo">
                    <label for="senha">SENHA</label>
                    <input type="password" id="senha" class="campo-entrada" placeholder="••••••••" required>
                </div>

                <div class="acoes-form">
                    <button type="submit" class="botao botao-primario w-full">Acessar</button>
                    <span class="link-cadastro">
                        Não tem conta? <a href="cadastro.html">Crie uma agora</a>
                    </span>
                </div>
            </form>
        </div>
    <script src="js/agamenon.js"></script>
    <script src="js/ui.js"></script>
        <script type="module" src="js/auth.js"></script>
    </body>
    </html>
