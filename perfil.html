<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arkhys | Perfil</title>
    <link rel="icon" type="image/png" href="assets/logo-arkhys-b.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,380..680&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style-global.css">

    <script type="module" src="js/loading.js"></script>
    <script type="module" src="js/supabase-config.js"></script>
</head>
<body>

    <div class="bg-dinamico" aria-hidden="true"></div>

    <!-- Logo flutuante exclusiva do mobile — fora do <nav> de propósito,
         pra não herdar o containing block do backdrop-filter do menu
         (senão ela fica presa dentro da barra inferior e tampa os botões) -->
    <a href="index.html" class="logo-mobile-flutuante" aria-label="Arkhys">
        <img src="assets/logo-arkhys.png" alt="Arkhys" loading="lazy">
    </a>

    <nav class="navegacao">
        <div class="nav-conteudo">
            <a href="index.html" class="nav-logo">
                <img src="assets/logo-arkhys.png" alt="Arkhys" loading="lazy">
            </a>

            <div class="nav-links">
                <a href="index.html" class="nav-item">
                    <span class="nav-icone">🏠</span>
                    <span>Início</span>
                </a>
                <a href="tarefas.html" class="nav-item">
                    <span class="nav-icone">📋</span>
                    <span>Tarefas</span>
                </a>
                <a href="cadastros.html" class="nav-item">
                    <span class="nav-icone">⚙️</span>
                    <span>Cadastros</span>
                </a>
                <a href="calendario.html" class="nav-item">
                    <span class="nav-icone">🗓️</span>
                    <span>Calendário</span>
                </a>
                <a href="xp.html" class="nav-item">
                    <span class="nav-icone">🏆</span>
                    <span>XP</span>
                </a>
                <a href="arquivos.html" class="nav-item">
                    <span class="nav-icone">📁</span>
                    <span>Cofre</span>
                </a>
                <a href="perfil.html" class="nav-item ativo">
                    <span class="nav-icone">👤</span>
                    <span>Perfil</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="conteudo-principal">
        <header class="cabecalho-pagina">
            <div class="cabecalho-texto">
                <h1>Meu Perfil</h1>
                <p>Gerencie seus dados e preferências</p>
            </div>
        </header>

        <div class="grade-cards">
            <div class="card-resumo card-perfil-avatar">
                <div class="avatar-perfil" id="avatarPerfil"><span id="avatarIniciais">?</span></div>
                <div class="card-titulo" id="nomePerfil">Carregando...</div>
                <div class="card-detalhe" id="emailPerfil">Carregando...</div>
                <div class="acoes-avatar-perfil">
                    <button type="button" id="btnAlterarFoto" class="botao botao-secundario btn-alterar-foto">📷 Alterar foto</button>
                    <button type="button" id="btnRemoverFoto" class="botao botao-perigo btn-alterar-foto" hidden>🗑️ Remover foto</button>
                </div>
                <input type="file" id="inputFotoPerfil" accept="image/*" hidden>
            </div>

            <div class="card-resumo">
                <div class="card-icone">⭐</div>
                <div class="card-titulo" id="nivelPerfil">Nível 1</div>
                <div class="card-detalhe" id="xpPerfil">0 XP acumulado</div>
            </div>
        </div>

        <div class="form-acesso" style="margin-top: 2rem;">
            <h3>Editar Dados</h3>
            <form id="formPerfil">
                <div class="grupo-campo">
                    <label>NOME COMPLETO</label>
                    <input type="text" id="editarNome" class="campo-entrada" required>
                </div>
                <div class="acoes-form">
                    <button type="submit" class="botao botao-primario w-full">Salvar Alterações</button>
                    <button type="button" id="btnRelatorio" class="botao botao-secundario w-full">📄 Gerar Relatório Geral</button>
                    <button type="button" id="btnSair" class="botao botao-perigo w-full">🚪 Sair da Conta</button>
                </div>
            </form>
        </div>
    </main>

        <script src="js/ui.js"></script>

    <script type="module" src="js/perfil.js"></script>
</body>
</html>
